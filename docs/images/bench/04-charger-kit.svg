<text x="270.0" y="366.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#e6ecf7" font-weight="600" text-anchor="middle">charger</text>
<rect x="106" y="240" width="40" height="60" rx="6" fill="#c9ccce" stroke="#1e2622" stroke-width="2" />
<text x="132" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#e6ecf7" font-weight="600" text-anchor="start">USB-C in</text>
