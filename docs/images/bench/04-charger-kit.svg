<text x="470" y="140.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1e2622" font-weight="700" text-anchor="start">1.25 mm lead: red to OUT, black to GND</text>
<text x="40" y="726.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#c0392b" font-weight="700" text-anchor="start">Before soldering: send a photo of the charger's pads and of J2 with the lead plugged in.</text>
<text x="40" y="760.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1e2622" font-weight="400" text-anchor="start">Pass: with USB only on the charger, the Kit starts and beeps. Unplug USB: it keeps running from the pack.</text>
<text x="40" y="796.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">J2 position on the underside is approximate; the pad names on both boards are what count.</text></svg>