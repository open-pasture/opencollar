<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2622"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ef"/><text x="40" y="50.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#1e2622" font-weight="700" text-anchor="start">Test 4: the charger powers the Kit (one soldering job)</text>
<text x="40" y="84.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">A 1.25 mm lead goes from the charger's OUT and GND to the Kit's J2. This is the wiring the carrier board will use.</text>
