<text x="40" y="560.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1e2622" font-weight="400" text-anchor="start">1. Plug the pack's plug into the BATT socket (it only fits one way).</text>
<text x="40" y="592.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1e2622" font-weight="400" text-anchor="start">2. Plug USB into the charger. The CHG light comes on while it charges.</text>
<text x="40" y="624.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1e2622" font-weight="400" text-anchor="start">3. Measure the pack again after 15–30 minutes: it should read a little higher.</text>
<text x="40" y="670.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">Layout is approximate; go by the names printed on the board.</text></svg>