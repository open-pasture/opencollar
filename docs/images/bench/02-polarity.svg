<text x="620" y="620.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#c0392b" font-weight="700" text-anchor="start">Minus sign: wires are swapped. Stop.</text>
<text x="40" y="662.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">Dial on DC volts (V with the straight line). Red probe to the red wire's contact, black probe to the black wire's.</text>
<text x="40" y="688.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1e2622" font-weight="600" text-anchor="start">Keep the two probe tips apart: touching them across the pack shorts it. Expect between 3.7 and 4.2 V.</text></svg>