<text x="80" y="940.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#1e2622" font-weight="600" text-anchor="start">Label printer</text>
<text x="80" y="974.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">Brother QL-800 · ~$100</text>
<text x="80" y="1010.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">serial number + QR code</text>
<text x="1100" y="935.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#1e2622" font-weight="600" text-anchor="start">Do-it-yourself station: roughly $600–1,500</text>
<text x="1100" y="968.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#6b726d" font-weight="400" text-anchor="start">in parts. A fixture maker builds one for</text>
<text x="1100" y="996.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#6b726d" font-weight="400" text-anchor="start">about $3–10k (MANUFACTURING.md).</text></svg>