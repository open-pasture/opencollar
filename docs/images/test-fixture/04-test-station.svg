<rect x="1100" y="420" width="440" height="190" rx="10" fill="white" stroke="#1e2622" stroke-width="1.5" />
<text x="1120" y="460.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#1e2622" font-weight="600" text-anchor="start">Solar stand-in</text>
<text x="1120" y="494.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">USB bench supply, e.g. Riden RD6006 · ~$90</text>
<text x="1120" y="530.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">SOLAR pads: fakes a 6 V panel</text>
