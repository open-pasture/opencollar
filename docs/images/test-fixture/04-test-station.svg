<rect x="1100" y="680" width="440" height="190" rx="10" fill="white" stroke="#1e2622" stroke-width="1.5" />
<text x="1120" y="720.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#1e2622" font-weight="600" text-anchor="start">Voltage checks</text>
<text x="1120" y="754.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">2 × ADS1115 ADC boards · ~$10 each</text>
<text x="1120" y="790.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">rail pads: 3V3, charger, TS, ISET</text>
<line x1="1100" y1="775" x2="986" y2="600" stroke="#1e2622" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="170" width="360" height="170" rx="10" fill="white" stroke="#1e2622" stroke-width="1.5" />
<text x="640" y="210.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#1e2622" font-weight="600" text-anchor="start">Switching</text>
<text x="640" y="244.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">8-channel USB relay board · ~$20</text>
<text x="640" y="280.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">connects each supply in turn</text>
<line x1="800.0" y1="340" x2="800.0" y2="414" stroke="#1e2622" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="790" width="360" height="190" rx="10" fill="white" stroke="#1e2622" stroke-width="1.5" />
<text x="640" y="830.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#1e2622" font-weight="600" text-anchor="start">Radios</text>
<text x="640" y="864.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">test SIM on the real network;</text>
<text x="640" y="888.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">a GNSS re-radiator later · $200–600</text>
<text x="640" y="920.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">LTE attach, satellites seen</text>
