<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2622"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ef"/><text x="60" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#1e2622" font-weight="600" text-anchor="start">The test station: what the fixture plugs into</text>
<text x="60" y="108.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#6b726d" font-weight="400" text-anchor="start">Example parts and rough prices. Every box talks to the Raspberry Pi, which runs the test script.</text>
<rect x="620" y="420" width="360" height="220" rx="12" fill="#e3ece5" stroke="#2f6f4a" stroke-width="3" />
<text x="800.0" y="510.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#2f6f4a" font-weight="600" text-anchor="middle">Fixture</text>
<text x="800.0" y="550.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#6b726d" font-weight="400" text-anchor="middle">board on the pins</text>
<text x="800.0" y="580.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#6b726d" font-weight="400" text-anchor="middle">~33 wires out</text>
<rect x="60" y="170" width="440" height="190" rx="10" fill="white" stroke="#1e2622" stroke-width="1.5" />
<text x="80" y="210.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#1e2622" font-weight="600" text-anchor="start">Test computer</text>
<text x="80" y="244.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">Raspberry Pi 5 · ~$60–80</text>
<text x="80" y="280.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">runs the script; USB to every box here</text>
<rect x="60" y="420" width="440" height="190" rx="10" fill="white" stroke="#1e2622" stroke-width="1.5" />
<text x="80" y="460.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#1e2622" font-weight="600" text-anchor="start">Programmer</text>
<text x="80" y="494.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">Raspberry Pi Debug Probe · $12</text>
<text x="80" y="518.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">or SEGGER J-Link · ~$500</text>
<text x="80" y="550.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">SWD pads: flashes firmware</text>
<line x1="500" y1="515" x2="614" y2="480" stroke="#1e2622" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="680" width="440" height="190" rx="10" fill="white" stroke="#1e2622" stroke-width="1.5" />
<text x="80" y="720.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#1e2622" font-weight="600" text-anchor="start">Serial console</text>
<text x="80" y="754.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">FTDI TTL-232R-3V3 cable · ~$20</text>
<text x="80" y="790.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">UART pads: reads test output</text>
