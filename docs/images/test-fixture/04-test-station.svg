<text x="1120" y="244.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1e2622" font-weight="400" text-anchor="start">Nordic Power Profiler Kit II · ~$100</text>
<text x="1120" y="280.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">BAT pads: supplies 3.3 V, measures</text>
<text x="1120" y="303.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b726d" font-weight="400" text-anchor="start">from under 1 µA to 1 A</text>
