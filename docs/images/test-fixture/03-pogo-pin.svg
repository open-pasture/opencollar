<text x="760" y="720.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#6b726d" font-weight="400" text-anchor="start">Typical size for our boards: “100 mil” probes (2.54 mm spacing),</text>
<text x="760" y="748.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#6b726d" font-weight="400" text-anchor="start">~1 mm barrel, rated for tens of thousands of presses.</text>
