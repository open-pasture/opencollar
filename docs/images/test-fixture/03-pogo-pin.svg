<text x="60" y="108.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#6b726d" font-weight="400" text-anchor="start">About 1 mm wide. A spring inside keeps the tip pressed onto the pad, even if the board sits slightly crooked.</text>
