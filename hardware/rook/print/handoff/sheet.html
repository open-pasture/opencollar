<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #fff; font: 22px/1.3 -apple-system, Helvetica, Arial, sans-serif; color: #1d1d1f; }
  .sheet { width: 1000px; padding: 32px 40px 24px; box-sizing: border-box; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: #444; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; }
  figure { margin: 0; }
  img { width: 100%; display: block; }
  figcaption { display: flex; justify-content: space-between; border-top: 1px solid #ddd; padding: 6px 2px 14px; }
  .name { font-family: Menlo, monospace; font-size: 19px; }
  .qty { font-weight: 600; }
</style></head><body><div class="sheet">
  <h1>9 pieces, 8 files</h1>
  <p class="lead">Each part shown the way it sits on the bed. The files are already turned this way.</p>
  <div class="grid">
    <figure><img src="../bed_views/top_unit_base.png"><figcaption><span class="name">top_unit_base.stl</span><span class="qty">Print 1</span></figcaption></figure>
    <figure><img src="../bed_views/top_unit_lid.png"><figcaption><span class="name">top_unit_lid.stl</span><span class="qty">Print 1</span></figcaption></figure>
    <figure><img src="../bed_views/top_unit_clamp_bar.png"><figcaption><span class="name">top_unit_clamp_bar.stl</span><span class="qty">Print 2</span></figcaption></figure>
    <figure><img src="../bed_views/bay_cradle.png"><figcaption><span class="name">bay_cradle.stl</span><span class="qty">Print 1</span></figcaption></figure>
    <figure><img src="../bed_views/bay_ballast_module.png"><figcaption><span class="name">bay_ballast_module.stl</span><span class="qty">Print 1</span></figcaption></figure>
    <figure><img src="../bed_views/fit_test.png"><figcaption><span class="name">fit_test.stl</span><span class="qty">Print 1</span></figcaption></figure>
    <figure><img src="../bed_views/seal_box_box.png"><figcaption><span class="name">seal_box_box.stl</span><span class="qty">Print 1</span></figcaption></figure>
    <figure><img src="../bed_views/seal_box_lid.png"><figcaption><span class="name">seal_box_lid.stl</span><span class="qty">Print 1</span></figcaption></figure>
  </div>
</div></body></html>
