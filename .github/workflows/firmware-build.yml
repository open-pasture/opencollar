# Rook firmware: host tests + NCS v3.4.1 sysbuild (MCUboot merged.hex).
# Kept in its own file so draft PRs that add starling.yml / other CI do not
# conflict on .github/workflows/ci.yml.
#
# Builds:
#   1) main config (prj.conf) → firmware/build/merged.hex
#   2) Rook LTE (EXTRA_CONF_FILE=rook/rook.conf) → build-rook/merged.hex
#   3) Rook LTE mock (rook.conf;rook-mock.conf) — compile check only
#
# Until PR #12 (rook-lte-v1) merges, the LTE builds check out that branch
# when firmware/rook/rook.conf is missing from the PR head.
name: Firmware build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"

permissions:
  contents: read

env:
  NCS_VERSION: v3.4.1
  # PR #12 head branch that carries firmware/rook/ until it lands on main.
  ROOK_LTE_FALLBACK_REF: rook-lte-v1

jobs:
  # Host tests stay independent of the NCS toolchain so they keep working
  # even if the sysbuild job cannot provision the SDK on the runner.
  host-tests:
    name: Firmware host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make
      - name: Host tests
        run: make -C firmware/tests/host

  ncs-sysbuild:
    name: NCS sysbuild (merged.hex)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make wget ca-certificates

      - name: Install nrfutil + sdk-manager
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 \
            -o /usr/local/bin/nrfutil \
            https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          chmod +x /usr/local/bin/nrfutil
          nrfutil install sdk-manager
          nrfutil --version
          nrfutil sdk-manager --help >/dev/null

      - name: Cache NCS SDK and toolchain
        id: cache-ncs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/ncs/${{ env.NCS_VERSION }}
            ~/ncs/toolchains
          key: ncs-${{ env.NCS_VERSION }}-sdk-toolchain-v1

      - name: Install NCS ${{ env.NCS_VERSION }}
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # sdk-manager may prompt for licence acceptance. Feed "y", but do not
          # let `yes`'s SIGPIPE fail the step under pipefail when nrfutil closes
          # stdin after a successful install.
          set +o pipefail
          yes | nrfutil sdk-manager install "${NCS_VERSION}" \
            --log-output stdout --log-level info
          install_status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$install_status" -ne 0 ]]; then
            echo "::error::nrfutil sdk-manager install failed with status ${install_status}"
            exit "$install_status"
          fi
          test -d "${HOME}/ncs/${NCS_VERSION}/zephyr"
          # Drop install tarballs so the runner / cache stay within disk limits.
          rm -rf "${HOME}/ncs/downloads" || true

      - name: Verify NCS layout
        run: |
          set -euo pipefail
          test -d "${HOME}/ncs/${NCS_VERSION}/zephyr"
          test -d "${HOME}/ncs/${NCS_VERSION}/nrf"
          ls -la "${HOME}/ncs/${NCS_VERSION}"
          nrfutil sdk-manager list

      - name: Host tests (same job, before west)
        run: make -C firmware/tests/host

      - name: Sysbuild main config (prj.conf)
        run: |
          set -euo pipefail
          # build.sh also probes ~/ncs and /opt/nordic; set ZEPHYR_BASE
          # explicitly so CI never depends on that auto-detect.
          export ZEPHYR_BASE="${HOME}/ncs/${NCS_VERSION}/zephyr"
          test -d "${ZEPHYR_BASE}"
          mkdir -p firmware/build-ci-logs
          log="firmware/build-ci-logs/sysbuild.log"
          nrfutil sdk-manager toolchain launch --ncs-version "${NCS_VERSION}" -- \
            env ZEPHYR_BASE="${ZEPHYR_BASE}" \
            bash -lc 'cd firmware && ./build.sh' 2>&1 | tee "${log}"
          test -f firmware/build/merged.hex
          test -f firmware/build/firmware/zephyr/zephyr.signed.hex
          test -f firmware/build/dfu_application.zip
          ls -l firmware/build/merged.hex \
            firmware/build/firmware/zephyr/zephyr.signed.hex \
            firmware/build/dfu_application.zip

      - name: Upload main-config flashable artifacts (BENCH / MCUboot DEV KEY)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rook-firmware-BENCH-devkey-nrf9151-connectkit-${{ github.sha }}
          path: |
            firmware/build/merged.hex
            firmware/build/firmware/zephyr/zephyr.signed.hex
            firmware/build/dfu_application.zip
            firmware/build-ci-logs/sysbuild.log
          retention-days: 14
          if-no-files-found: error

      - name: Resolve Rook LTE source tree
        id: rook_src
        run: |
          set -euo pipefail
          if [[ -f firmware/rook/rook.conf ]]; then
            echo "root=." >> "$GITHUB_OUTPUT"
            echo "ref=checkout (firmware/rook present)" >> "$GITHUB_OUTPUT"
            echo "Using PR/checkout tree for Rook LTE (firmware/rook/rook.conf present)."
          else
            echo "root=rook-lte" >> "$GITHUB_OUTPUT"
            echo "ref=${ROOK_LTE_FALLBACK_REF} (PR #12 until merged)" >> "$GITHUB_OUTPUT"
            echo "firmware/rook/rook.conf missing; will build from ${ROOK_LTE_FALLBACK_REF}."
          fi

      - name: Checkout ${{ env.ROOK_LTE_FALLBACK_REF }} for Rook LTE
        if: steps.rook_src.outputs.root == 'rook-lte'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.ROOK_LTE_FALLBACK_REF }}
          path: rook-lte

      - name: Sysbuild Rook LTE (EXTRA_CONF_FILE=rook/rook.conf)
        id: rook_lte
        run: |
          set -euo pipefail
          export ZEPHYR_BASE="${HOME}/ncs/${NCS_VERSION}/zephyr"
          test -d "${ZEPHYR_BASE}"
          root="${{ steps.rook_src.outputs.root }}"
          fw="${root}/firmware"
          test -f "${fw}/rook/rook.conf"
          mkdir -p firmware/build-ci-logs
          log="firmware/build-ci-logs/sysbuild-rook-lte.log"
          # Match the command verified by op-fw-rook-lte on NCS v3.4.1.
          # EXTRA_CONF_FILE layers on prj.conf; CONF_FILE would replace it.
          nrfutil sdk-manager toolchain launch --ncs-version "${NCS_VERSION}" -- \
            env ZEPHYR_BASE="${ZEPHYR_BASE}" \
            bash -lc "
              set -euo pipefail
              cd '${fw}'
              export ZEPHYR_BASE='${ZEPHYR_BASE}'
              west build -p --sysbuild -b nrf9151_connectkit/nrf9151/ns -d build-rook . -- \
                -DBOARD_ROOT=\"\$PWD\" -DEXTRA_CONF_FILE=\"rook/rook.conf\"
              python3 scripts/check_image.py build-rook/firmware/zephyr
              grep -q '^CONFIG_ROOK_LTE=y\$' build-rook/firmware/zephyr/.config
              ls -l build-rook/merged.hex
              # Expected ~572 KB (bench image with LTE); fail if wildly off.
              sz=\$(stat -c%s build-rook/merged.hex)
              echo \"merged.hex size=\${sz}\"
              if [[ \"\$sz\" -lt 500000 || \"\$sz\" -gt 700000 ]]; then
                echo \"::error::unexpected build-rook/merged.hex size \${sz} (want ~572000)\"
                exit 1
              fi
            " 2>&1 | tee "${log}"
          # Normalize path for the upload step (symlink or copy into workspace).
          mkdir -p firmware/build-rook
          cp -a "${fw}/build-rook/merged.hex" firmware/build-rook/merged.hex
          cp -a "${fw}/build-rook/firmware/zephyr/zephyr.signed.hex" \
            firmware/build-rook/zephyr.signed.hex
          test -f "${fw}/build-rook/dfu_application.zip"
          cp -a "${fw}/build-rook/dfu_application.zip" \
            firmware/build-rook/dfu_application.zip
          # Bench-only marker shipped with the artifact.
          printf '%s\n' \
            'BENCH BUILD - NOT FOR FIELD USE' \
            '' \
            "This image is signed with MCUboot's public default ECDSA P-256 key." \
            'That private half is public; anyone can forge images for boards' \
            'flashed with it. Replace SB_CONFIG_BOOT_SIGNATURE_KEY_FILE before' \
            'any field/production build. See docs/runbooks/mcuboot-flash.md and' \
            'docs/runbooks/ci-firmware.md.' \
            > firmware/build-rook/BENCH-ONLY-DEV-KEY.txt

      - name: Upload Rook LTE flashable artifacts (BENCH / MCUboot DEV KEY)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rook-lte-BENCH-devkey-nrf9151-connectkit-${{ github.sha }}
          path: |
            firmware/build-rook/merged.hex
            firmware/build-rook/zephyr.signed.hex
            firmware/build-rook/dfu_application.zip
            firmware/build-rook/BENCH-ONLY-DEV-KEY.txt
            firmware/build-ci-logs/sysbuild-rook-lte.log
          retention-days: 14
          if-no-files-found: error

      - name: Sysbuild Rook LTE mock (compile check)
        run: |
          set -euo pipefail
          export ZEPHYR_BASE="${HOME}/ncs/${NCS_VERSION}/zephyr"
          root="${{ steps.rook_src.outputs.root }}"
          fw="${root}/firmware"
          test -f "${fw}/rook/rook-mock.conf"
          log="firmware/build-ci-logs/sysbuild-rook-lte-mock.log"
          nrfutil sdk-manager toolchain launch --ncs-version "${NCS_VERSION}" -- \
            env ZEPHYR_BASE="${ZEPHYR_BASE}" \
            bash -lc "
              set -euo pipefail
              cd '${fw}'
              export ZEPHYR_BASE='${ZEPHYR_BASE}'
              west build -p --sysbuild -b nrf9151_connectkit/nrf9151/ns -d build-rook-mock . -- \
                -DBOARD_ROOT=\"\$PWD\" \
                -DEXTRA_CONF_FILE=\"rook/rook.conf;rook/rook-mock.conf\"
              python3 scripts/check_image.py build-rook-mock/firmware/zephyr
              grep -q '^CONFIG_ROOK_LTE=y\$' build-rook-mock/firmware/zephyr/.config
              grep -q '^CONFIG_ROOK_LTE_ALLOW_HTTP=y\$' build-rook-mock/firmware/zephyr/.config
              ls -l build-rook-mock/merged.hex
            " 2>&1 | tee "${log}"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rook-firmware-sysbuild-log-failed-${{ github.sha }}
          path: firmware/build-ci-logs/
          retention-days: 14
          if-no-files-found: warn
