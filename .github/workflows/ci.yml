# Firmware host tests, and the protocol's vectors: the firmware's copies must
# match protocol/vectors/ (the source of truth), the independent Python reader
# must agree with them (records, beacons, the slot schedule), and every v2
# vector must get the CDDL schema's verdict it declares. The Rust reference,
# its fuzz test and its copy check run in openpasture's CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make -C firmware/tests/host

  vectors:
    name: Protocol vectors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Firmware copies match protocol/vectors
        run: |
          fail=0
          for f in firmware/tests/host/vectors/*.json; do
            want="protocol/vectors/$(basename "$f")"
            if ! cmp -s "$f" "$want"; then
              echo "::error file=$f::differs from $want (copy it over: protocol/vectors/README.md)"
              fail=1
            fi
          done
          exit "$fail"
      - name: Reference reader
        run: |
          python3 -I protocol/reference/opencollar_decode.py --test protocol/vectors/v2/records.json
          python3 -I protocol/reference/opencollar_decode.py --test-link protocol/vectors/v2/link.json
      - name: CDDL schema
        run: |
          sudo gem install --no-document cddl -v 0.12.14
          python3 -I protocol/conformance/check_cddl.py
