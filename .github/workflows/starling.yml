# SPDX-License-Identifier: Apache-2.0
# Minimal Starling CI until op-firmware publishes a shared nRF52840 west hook.
name: Starling

on:
  push:
    paths:
      - "firmware/starling/**"
      - "firmware/core/**"
      - "firmware/src/geofence.*"
      - "firmware/src/cue.*"
      - "firmware/src/shape.*"
      - "firmware/src/protocol.*"
      - "firmware/third_party/monocypher/**"
      - ".github/workflows/starling.yml"
  pull_request:
    paths:
      - "firmware/starling/**"
      - "firmware/core/**"
      - "firmware/src/geofence.*"
      - "firmware/src/cue.*"
      - "firmware/src/shape.*"
      - "firmware/src/protocol.*"
      - "firmware/third_party/monocypher/**"
      - ".github/workflows/starling.yml"

permissions:
  contents: read

jobs:
  host:
    name: Starling host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make -C firmware/starling/tests/host
