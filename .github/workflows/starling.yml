# SPDX-License-Identifier: Apache-2.0
# Minimal Starling CI until op-firmware publishes a shared nRF52840 west hook.
name: Starling

on:
  push:
    paths:
      - "firmware/starling/**"
      - "firmware/core/**"
      - "firmware/src/geofence.*"
      - "firmware/src/cue.*"
      - "firmware/src/shape.*"
      - "firmware/src/protocol.*"
      - "firmware/third_party/monocypher/**"
      - ".github/workflows/starling.yml"
  pull_request:
    paths:
      - "firmware/starling/**"
      - "firmware/core/**"
      - "firmware/src/geofence.*"
      - "firmware/src/cue.*"
      - "firmware/src/shape.*"
      - "firmware/src/protocol.*"
      - "firmware/third_party/monocypher/**"
      - ".github/workflows/starling.yml"

permissions:
  contents: read

jobs:
  host:
    name: Starling host tests
    runs-on: ubuntu-24.04
    # Host tests are plain C Make; they do not need Zephyr.
    # When a west/nRF52840 job is added, set ZEPHYR_BASE explicitly in that
    # job — firmware/starling/build.sh only falls back to
    # /opt/nordic/ncs/v3.4.1/zephyr when ZEPHYR_BASE is unset.
    env:
      # Placeholder for a future west job on a runner with NCS installed.
      # Leave empty here so host tests never accidentally pick a missing tree.
      ZEPHYR_BASE: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make
      - name: Host tests
        run: make -C firmware/starling/tests/host
