# MCUboot as the first-stage bootloader; build/merged.hex = MCUboot + TF-M + app.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
# DEV KEY ONLY: with no SB_CONFIG_BOOT_SIGNATURE_KEY_FILE set, images are signed
# with MCUboot's public default key (bootloader/mcuboot/root-ec-p256.pem in the
# SDK). Anyone can sign images for it. Replace with a project key kept outside
# this repo before any field build (the key is frozen into MCUboot at manufacture).
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
