# Rook LTE-M reporter: west build ... -- -DEXTRA_CONF_FILE=rook/rook.conf
CONFIG_ROOK_LTE=y
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE=n
CONFIG_NET_IPV4=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MODEM_KEY_MGMT=y
# Staging (Railway, Let's Encrypt): ISRG Root X1, written to sec tag 42 at first attach
CONFIG_ROOK_LTE_CA_PEM="rook/certs/isrg-root-x1.pem"
CONFIG_LTE_LC_PSM_MODULE=y
# Reporter buffers live in static RAM; main thread keeps Ed25519's 8 KB
