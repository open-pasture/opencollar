# TF-M
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General
CONFIG_FPU=y
# Ed25519 checks run on the main thread, never on the system workqueue
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_POLL=y

# Logging over the USB serial port. Deferred, so printing a log line never
# holds interrupts off while a long command arrives on the same port.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_CBPRINTF_FP_SUPPORT=y

# Console line input: provision, status and bench commands (src/console.c)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Flash storage (NVS on the 64 KB `storage` partition): provisioning,
# config, slots and pending acks
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_DATA_CRC=y
# The storage area was part of the application area before 0.2
CONFIG_NVS_INIT_BAD_MEMORY_REGION=y

# Modem and GNSS
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y

# GNSS LNA on this board is powered from the nRF9151 COEX0 pin
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_GNSS_EXTERNAL=y
CONFIG_MODEM_ANTENNA_AT_COEX0="AT%XCOEX0=1,1,1565,1586"

# Qwiic Buzzer
CONFIG_I2C=y
