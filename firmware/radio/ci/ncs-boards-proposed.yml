# PROPOSED for op-firmware — do not enable until an NCS v3.4.1 runner exists.
# SPDX-License-Identifier: Apache-2.0
name: Radio NCS boards (proposed)

on:
  workflow_dispatch:

jobs:
  radio-boards:
    name: SX1262 pingpong boards
    runs-on: ubuntu-24.04  # replace with NCS-capable runner
    steps:
      - uses: actions/checkout@v4
      - name: Build XIAO + Wio-SX1262
        run: |
          # Requires ZEPHYR_BASE / west from NCS v3.4.1
          nrfutil sdk-manager toolchain launch --ncs-version v3.4.1 -- \
            firmware/radio/scripts/build_xiao.sh
      - name: Build nRF9151 + Core1262 overlay
        run: |
          nrfutil sdk-manager toolchain launch --ncs-version v3.4.1 -- \
            firmware/radio/scripts/build_nrf9151.sh
