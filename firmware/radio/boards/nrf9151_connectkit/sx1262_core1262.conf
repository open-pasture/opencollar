# Fragment for the Rook radio bring-up image (not the full collar app).
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y

# Match the collar TF-M profile; keep the image small for radio-only bring-up.
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# No LTE/GNSS in the ping/pong sample — radio path only.
CONFIG_NRF_MODEM_LIB=n
CONFIG_LTE_LINK_CONTROL=n
CONFIG_MODEM_ANTENNA=n
