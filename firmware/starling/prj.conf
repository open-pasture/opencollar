# Starling nRF52840 (XIAO / Wio-SX1262 class). No modem; external GNSS + LoRa.

CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_DATA_CRC=y

CONFIG_STARLING_GNSS_FAKE=y
CONFIG_STARLING_SERVE=n
CONFIG_STARLING_BENCH_FENCE=y
